<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Musica.ia</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="estilo.css">
</head>

<body>

  <canvas id="aurora" aria-hidden="true"></canvas>
  <main class="contenido">
    <img class="imagen-portada imagen-chica" src="imagenes/chicaportada.png" alt="Mujer con audífonos">

    <section class="texto-portada">
      <p class="titulo">
        <span class="titulo-linea">¿PODEMOS</span>
        <span class="titulo-linea">RECONOCER UNA</span>
        <span class="titulo-linea">CANCION <span class="frase-ia">HECHA</span></span>
        <span class="titulo-linea frase-ia">CON IA?</span>
      </p>

      <p class="subtitulo">La inteligencia artificial ya es capaz de crear
        canciones completas: puede generar voces,
        melodías, letras e instrumentos en cuestión
        de segundos. Por esto, esta pregunta es
        cada vez mas dificil de resolver</p>
    </section>

    <div class="sonido-portada" aria-hidden="true">
      <img class="onda-horizontal" src="imagenes/lineasonidoinicio.png" alt="">
      <img class="linea-angular" src="imagenes/lineanucleo2.png" alt="">
      <img class="onda-secundaria" src="imagenes/lineanucelo2.png" alt="">
    </div>

    <img class="imagen-portada imagen-oreja" src="imagenes/oreja.png" alt="Oreja ilustrada">
  </main>

  <script>
    const canvas = document.querySelector('#aurora');
    const context = canvas.getContext('2d');

    const colorStops = ['#5227FF', '#B497CF', '#FF9FFC'];
    const speed = 0.0022;

    function resizeCanvas() {
      const pixelRatio = Math.min(window.devicePixelRatio || 1, 2);

      canvas.width = window.innerWidth * pixelRatio;
      canvas.height = window.innerHeight * pixelRatio;

      canvas.style.width = `${window.innerWidth}px`;
      canvas.style.height = `${window.innerHeight}px`;

      context.setTransform(pixelRatio, 0, 0, pixelRatio, 0, 0);
    }

    function drawAurora(time) {

      const width = window.innerWidth;
      const height = window.innerHeight;

      context.clearRect(0, 0, width, height);

      context.save();

      context.globalCompositeOperation = 'screen';
      context.filter = 'blur(18px)';

      for (let layer = 0; layer < 3; layer += 1) {

        const gradient = context.createLinearGradient(0, 0, width, 0);

        gradient.addColorStop(
          0,
          `${colorStops[layer]}00`
        );

        gradient.addColorStop(
          0.5,
          `${colorStops[layer]}b8`
        );

        gradient.addColorStop(
          1,
          `${colorStops[(layer + 1) % 3]}00`
        );

        context.fillStyle = gradient;

        context.beginPath();

        const verticalMovement = Math.sin(
          time * 0.00022 + layer * 1.8
        ) * height * 0.34;

        const auraCenter = height * 0.5 + verticalMovement;

        context.moveTo(
          0,
          auraCenter - height * 0.16 + layer * 24
        );

        for (let x = 0; x <= width; x += 12) {

          const wave =
            Math.sin(
              x * 0.008 -
              time * speed +
              layer
            ) * 34;

          const secondWave =
            Math.sin(
              x * 0.015 -
              time * speed * 1.4
            ) * 18;

          context.lineTo(
            x,
            auraCenter -
            height * 0.16 +
            layer * 24 +
            wave +
            secondWave
          );
        }

        context.lineTo(
          width,
          auraCenter + height * 0.34 + layer * 24
        );

        context.lineTo(
          0,
          auraCenter + height * 0.34 + layer * 24
        );

        context.closePath();

        context.fill();
      }

      context.restore();

      requestAnimationFrame(drawAurora);
    }

    window.addEventListener('resize', resizeCanvas);

    resizeCanvas();

    requestAnimationFrame(drawAurora);
  </script>

</body>
</html>
